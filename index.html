<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230B0B0D'/%3E%3Crect x='4' y='4' width='24' height='24' rx='4' fill='none' stroke='%23E4572E' stroke-width='2'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KEYFORGE — a custom mechanical keyboard configurator." />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0B0B0D" />
    <title>KEYFORGE — Custom Mechanical Keyboards</title>

    <!-- The product is a link you send someone, so a pasted build previews as
         the real board. og.png is generated from the app's own geometry by
         `npm run og`. og:image must be an absolute URL — crawlers do not
         resolve relative paths. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KEYFORGE" />
    <meta property="og:url" content="https://tomasis7.github.io/keyforge/" />
    <meta property="og:image" content="https://tomasis7.github.io/keyforge/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="KEYFORGE — Build your endgame. A custom mechanical keyboard shown in a dark case with orange accent keycaps."
    />
    <meta property="og:title" content="KEYFORGE — Build your endgame" />
    <meta
      property="og:description"
      content="Configure a custom mechanical keyboard: layout, case, keycaps, switches, plate and extras. Priced live, shareable in one link."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://tomasis7.github.io/keyforge/og.png" />
    <meta name="twitter:title" content="KEYFORGE — Build your endgame" />
    <meta
      name="twitter:description"
      content="Configure a custom mechanical keyboard: layout, case, keycaps, switches, plate and extras. Priced live, shareable in one link."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
